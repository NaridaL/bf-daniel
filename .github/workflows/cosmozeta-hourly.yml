name: CosmoZeta hourly agent

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: cosmozeta-game-session
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SESSION: cosmozeta

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser agent tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @playwright/cli@latest @github/copilot@latest
          playwright-cli install-browser chrome --with-deps

      - name: Test email-code authentication logic
        run: node --test tests/*.test.mjs

      - name: Restore agent progress state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .cosmozeta-state
          key: cosmozeta-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cosmozeta-state-${{ runner.os }}-

      - name: Initialize agent progress state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cosmozeta-state .cosmozeta-artifacts
          if [[ ! -f .cosmozeta-state/state.md ]]; then
            cat > .cosmozeta-state/state.md <<'EOF'
          # CosmoZeta agent state

          No prior run has been recorded.
          EOF
          fi

      - name: Start Chrome and log in
        shell: bash
        env:
          COSMOZETA_EMAIL: ${{ secrets.COSMOZETA_EMAIL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: adrian-1479@agentmail.to
        run: |
          set -euo pipefail
          umask 077

          env -u AGENTMAIL_API_KEY -u COSMOZETA_EMAIL \
            playwright-cli -s="${PLAYWRIGHT_SESSION}" open \
            "https://www.cosmozeta.com/?preview=cz-insider" \
            --browser chrome \
            --idle-timeout 600000 >/dev/null

          node scripts/cosmozeta-login.mjs

      - name: Progress the empire until useful actions are exhausted
        timeout-minutes: 20
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          prompt="$(cat docs/cosmozeta-gameplay-prompt.md)"

          copilot -p "${prompt}" \
            --autopilot \
            --model auto \
            --auto-tier efficiency \
            --context default \
            --max-ai-credits 30 \
            --max-autopilot-continues 12 \
            --no-ask-user \
            --disable-builtin-mcps \
            --no-custom-instructions \
            --no-auto-update \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --allow-tool='shell(playwright-cli:*)' \
            --allow-tool='write(.cosmozeta-state/state.md)' \
            --secret-env-vars=GITHUB_TOKEN \
            --usage-output-file .cosmozeta-artifacts/usage.json

      - name: Publish progress summary
        if: always()
        shell: bash
        run: |
          if [[ -f .cosmozeta-state/state.md ]]; then
            cat .cosmozeta-state/state.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close Playwright session
        if: always()
        shell: bash
        run: |
          playwright-cli -s="${PLAYWRIGHT_SESSION}" close >/dev/null 2>&1 || true

      - name: Save updated agent progress state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cosmozeta-state
          key: cosmozeta-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmozeta-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cosmozeta-state/state.md
            .cosmozeta-artifacts/usage.json
          if-no-files-found: warn
          retention-days: 3
